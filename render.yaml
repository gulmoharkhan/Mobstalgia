# Render "Blueprint" — lets Render auto-configure this service when you connect
# this repo, including a persistent disk so your catalog, orders, and uploaded
# photos survive restarts and redeploys. See README.md "Deploying" section.
services:
  - type: web
    name: teardown-frames
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: "node --experimental-sqlite server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.11.0
      - key: DATA_DIR
        value: /var/data/db
      - key: UPLOADS_DIR
        value: /var/data/uploads
    disk:
      name: teardown-frames-data
      mountPath: /var/data
      sizeGB: 1
